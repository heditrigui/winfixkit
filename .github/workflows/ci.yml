name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PESTER_VERSION: 5.7.1
  PSSA_VERSION: 1.23.0

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Save-Module PSScriptAnalyzer -RequiredVersion $env:PSSA_VERSION -Path "$env:RUNNER_TEMP/modules" -Force

      - name: Analyze
        shell: pwsh
        run: |
          $env:PSModulePath = "$env:RUNNER_TEMP/modules;$env:PSModulePath"
          Import-Module PSScriptAnalyzer -RequiredVersion $env:PSSA_VERSION
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap
          if ($results) { throw "PSScriptAnalyzer found $(@($results).Count) issue(s)." }

  test:
    name: Pester (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh] # Windows PowerShell 5.1 and PowerShell 7
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: Save-Module Pester -RequiredVersion $env:PESTER_VERSION -Path "$env:RUNNER_TEMP/modules" -Force

      # `shell` can't come from the matrix, so the same script runs under whichever shell this leg uses.
      - name: Run tests (Windows PowerShell 5.1)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          $env:PSModulePath = "$env:RUNNER_TEMP\modules;$env:PSModulePath"
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'testResults.xml'
          Invoke-Pester -Configuration $config

      - name: Run tests (PowerShell 7)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $env:PSModulePath = "$env:RUNNER_TEMP\modules;$env:PSModulePath"
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'testResults.xml'
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results-${{ matrix.shell }}
          path: testResults.xml
